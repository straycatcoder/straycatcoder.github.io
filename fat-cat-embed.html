<div class="fatcat-wrap">

<style>
.fatcat-wrap {
  display: grid;
  place-items: center;
  margin: 2rem 0;
  width: 100%;
}
#fatcat {
  margin: 0;
  padding: 1.25rem 1.5rem;
  font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 14px;
  line-height: 1.15;
  letter-spacing: 0;
  white-space: pre;
  background: #0e0f13;
  color: #8cff8c;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  box-shadow: 0 0 24px rgba(140,255,140,0.15);
  overflow-x: auto;
  max-width: 100%;
}
/* Amber variant: just change class */
.fatcat-wrap.amber #fatcat {
  color: #ffbf6b;
  box-shadow: 0 0 24px rgba(255,191,107,0.15);
}
@media (max-width: 600px) {
  #fatcat { font-size: 10.5px; padding: 1rem; }
}
</style>

  const speed = 450;
